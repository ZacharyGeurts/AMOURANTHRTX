name: AMOURANTHRTX QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev \
            libglib2.0-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libxinerama-dev libxxf86vm-dev \
            libxrender-dev libxcomposite-dev libxdamage-dev \
            libfreetype6-dev libcurl4-openssl-dev \
            libvulkan-dev glslc spirv-tools python3-pil

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFETCH_SDL3=ON
          cmake --build build --target amouranth_engine \
            qa_amouranthos_test qa_exit_shutdown_test qa_field_kilroy_test \
            qa_doom_host_test qa_doom_gpu_test qa_keen_host_test qa_rtxpm_test qa_rtx_vfs_test \
            qa_fieldstorage_test qa_taskbar_click_test qa_rtx_widgets_test qa_app_journal_test \
            qa_registry_test qa_memory_tier_test qa_raid_test -j"$(nproc)"

      - name: Build shaders
        run: make -C Navigator/shaders all

      - name: Stage DOS games + HD image
        run: python3 scripts/stage_dos_games.py

      - name: AmmoOS + headless QA
        run: |
          ./build/qa_amouranthos_test
          ./build/qa_exit_shutdown_test
          AMOURANTHRTX_MAX_FRAMES=60 AMOURANTHRTX_HEADLESS=1 \
            ./build/bin/Linux/AMOURANTHRTX
          python3 scripts/qa_startup_test.py

      - name: Field + DOS QA
        run: |
          ./build/bin/Linux/qa_field_kilroy_test
          ./build/bin/Linux/qa_rtx_vfs_test
          ./build/qa_taskbar_click_test
          ./build/qa_rtx_widgets_test
          ./build/qa_app_journal_test
          ./build/qa_registry_test
          ./build/qa_memory_tier_test
          ./build/qa_raid_test
          python3 scripts/qa_doom_test.py --skip-build

      - name: DOOM host QA
        run: ./build/qa_doom_host_test

      - name: Keen LZEXE host QA
        run: |
          ./build/qa_keen_host_test
          ./build/qa_rtxpm_test

      - name: FieldStorage v2 + dual-host QA
        run: |
          ./build/qa_fieldstorage_test
          python3 scripts/team_drive_test.py
          python3 scripts/bench_storage.py
          python3 scripts/zero_cost_audit.py --skip-qa

  windows-fieldstorage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev \
            libglib2.0-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libxinerama-dev libxxf86vm-dev \
            libxrender-dev libxcomposite-dev libxdamage-dev \
            libfreetype6-dev libcurl4-openssl-dev \
            libvulkan-dev glslc spirv-tools python3-pil

      - name: Dual-host FieldStorage matrix
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFETCH_SDL3=ON
          cmake --build build --target qa_fieldstorage_test -j"$(nproc)"
          AMOURANTHRTX_DUAL_HOST=1 AMOURANTHRTX_FIELD_STORAGE_V2=1 \
            ./build/qa_fieldstorage_test
          python3 scripts/team_drive_test.py
