name: AMOURANTHRTX QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libsdl3-dev libsdl3-image-dev libsdl3-ttf-dev libsdl3-mixer-dev \
            libvulkan-dev glslc spirv-tools python3-pil

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target amouranth_engine \
            qa_amouranthos_test qa_exit_shutdown_test qa_field_kilroy_test \
            qa_doom_host_test qa_rtx_vfs_test -j"$(nproc)"

      - name: Build shaders
        run: make -C Navigator/shaders all

      - name: Stage DOS games + HD image
        run: python3 scripts/stage_dos_games.py

      - name: AmmoOS + headless QA
        run: |
          ./build/qa_amouranthos_test
          ./build/qa_exit_shutdown_test
          AMOURANTHRTX_MAX_FRAMES=60 AMOURANTHRTX_HEADLESS=1 \
            ./build/bin/Linux/AMOURANTHRTX
          python3 scripts/qa_startup_test.py

      - name: Field + DOS QA
        run: |
          ./build/bin/Linux/qa_field_kilroy_test
          ./build/bin/Linux/qa_rtx_vfs_test

      - name: DOOM host QA (known PM32 title-screen gap)
        continue-on-error: true
        run: ./build/qa_doom_host_test
